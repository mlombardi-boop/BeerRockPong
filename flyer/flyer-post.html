<style>
:root{
  --night:#07101F; --court:#0D1A31; --line:#22385D;
  --sky:#5CC8FF; --orange:#FF7A1A; --ink:#EAF3FF; --muted:#8EA4C6;
  --f-display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,sans-serif;
  --f-data:"Barlow Condensed","Arial Narrow",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--f-body)}
.flyer{position:relative;width:1080px;height:1350px;overflow:hidden;
  background:
    radial-gradient(700px 520px at 50% 30%,rgba(92,200,255,.16),transparent 70%),
    radial-gradient(600px 400px at 100% 100%,rgba(255,122,26,.18),transparent 70%),
    var(--night);
  display:flex;flex-direction:column;align-items:center;padding:54px 64px 0}
/* líneas de cancha de fondo */
.flyer::before{content:"";position:absolute;inset:28px;border:3px solid rgba(92,200,255,.18);border-radius:28px;pointer-events:none}
.badge{position:relative;z-index:1;font-family:var(--f-data);font-weight:700;font-size:34px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--orange);border:3px solid var(--orange);border-radius:999px;padding:6px 30px}
.logo{position:relative;z-index:1;width:430px;margin-top:18px;filter:drop-shadow(0 22px 40px rgba(0,0,0,.55))}
.sub{position:relative;z-index:1;font-family:var(--f-data);font-weight:700;font-size:38px;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);margin-top:14px}
.date{position:relative;z-index:1;font-family:var(--f-display);font-size:104px;line-height:.92;letter-spacing:.02em;margin-top:18px;text-align:center}
.date span{color:var(--orange);display:block}
.venue{position:relative;z-index:1;text-align:center;margin-top:12px}
.venue b{display:block;font-family:var(--f-display);font-weight:400;font-size:64px;letter-spacing:.04em;line-height:1}
.venue i{font-style:normal;font-size:30px;color:var(--muted)}
.chips{position:relative;z-index:1;display:flex;gap:16px;margin-top:26px}
.chip{font-family:var(--f-data);font-weight:700;font-size:30px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--court);border:2px solid var(--line);border-radius:14px;padding:10px 20px}
.chip em{font-style:normal;color:var(--sky)}
.sponsor{position:relative;z-index:1;display:flex;align-items:center;gap:20px;margin-top:auto;margin-bottom:22px}
.sponsor span{font-family:var(--f-data);font-weight:700;font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.sponsor img{height:84px}
.band{position:relative;z-index:2;align-self:stretch;margin:0 -64px;background:var(--orange);color:#1A0B00;
  display:flex;justify-content:space-between;align-items:center;padding:24px 64px 30px}
.band .l{font-family:var(--f-display);font-size:48px;line-height:1}
.band .l small{display:block;font-family:var(--f-data);font-weight:700;font-size:26px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.band .r{text-align:right;font-family:var(--f-data);font-weight:700;font-size:26px;letter-spacing:.08em;text-transform:uppercase}
.band .r b{display:block;font-family:var(--f-display);font-weight:400;font-size:46px;letter-spacing:.02em;text-transform:none}
</style>
</head>
